core:changelogs:
  - content: "---\npackages:\n  npm:@fumapress/ai:\n    type: patch\n  npm:@fumapress/feedback:\n    type: patch\n  npm:@fumapress/graphql:\n    type: patch\n  npm:@fumapress/language:\n    type: patch\n  npm:@fumapress/mintlify:\n    type: patch\n  npm:@fumapress/notion:\n    type: patch\n  npm:@fumapress/obsidian:\n    type: patch\n  npm:@fumapress/sanity:\n    type: patch\n  npm:@fumapress/tegami:\n    type: patch\n---\n\n## Loosen `fumapress` dependency ranges\n\nPeer dependencies on `fumapress` (and `@fumapress/*`) now publish as `^x.y.z` instead of an exact version pin, so these packages stay compatible with newer core releases without needing a re-release.\n"
    filename: 2026-08-28-workspace-peer-ranges.md
    v: 0.0.0
  - content: "---\npackages:\n  npm:fumapress:\n    type: patch\n---\n\n### Accept string dates in `core:get-creation-date`\n\nFumadocs MDX serializes frontmatter as JSON, so a `date` field reaches the adapter as a string.\nThe hook only accepted `Date` objects and returned `undefined` otherwise, which made blog posts fall\nback to the build time. It now parses strings, like `tegami:get-date` already did.\n"
    filename: 2026-08-27-mdx-creation-date.md
    v: 0.0.0
